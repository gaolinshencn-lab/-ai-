<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>棋盘学堂</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="给零基础大学生的交互学习网站：电脑基础、网络名词、短视频、用 AI 学习、AI 编程。">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700&display=swap">
<style>
/* Layout: Go-board study room. Sticky header with a board-grid band, left column = tracks (tabs on phone), right = the lesson. Stones mark progress. */
:root {
  --paper: #eef1f4;
  --card: #ffffff;
  --ink: #18202c;
  --muted: #586374;
  --line: #d3dae3;
  --grid: rgba(24, 32, 44, 0.07);
  --accent: #2b47a3;
  --accent-soft: #e3e8f8;
  --wood: #c9913f;
  --wood-soft: #f5e6cc;
  --good: #1f7a4d;
  --good-soft: #dcf1e5;
  --bad: #b33a2e;
  --bad-soft: #f8e1de;
  --stone-b: #1a1d22;
  --stone-w: #fbfbf8;
  --code-bg: #f4f6f9;
  --font-display: "Noto Serif SC", "Songti SC", "SimSun", serif;
  --font-body: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Consolas, monospace;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f131a; --card: #161c26; --ink: #e5e9f0; --muted: #98a3b3; --line: #273142;
    --grid: rgba(229, 233, 240, 0.05); --accent: #8ea4ff; --accent-soft: #1e2847;
    --wood: #d7a252; --wood-soft: #3a2c16; --good: #5fcf96; --good-soft: #15342a;
    --bad: #ff8a7a; --bad-soft: #3d1d1a; --stone-b: #07080a; --stone-w: #eceae2; --code-bg: #10151d;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f131a; --card: #161c26; --ink: #e5e9f0; --muted: #98a3b3; --line: #273142;
  --grid: rgba(229, 233, 240, 0.05); --accent: #8ea4ff; --accent-soft: #1e2847;
  --wood: #d7a252; --wood-soft: #3a2c16; --good: #5fcf96; --good-soft: #15342a;
  --bad: #ff8a7a; --bad-soft: #3d1d1a; --stone-b: #07080a; --stone-w: #eceae2; --code-bg: #10151d;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font-family: var(--font-body); font-size: 15px; line-height: 1.75;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--card); }
a { color: var(--accent); }
button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
code, kbd, pre { font-family: var(--font-mono); font-size: 0.88em; }
code { background: var(--code-bg); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
kbd { background: var(--card); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; }
pre { background: var(--code-bg); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; overflow-x: auto; line-height: 1.55; margin: 0; }
pre code { background: none; border: 0; padding: 0; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; line-height: 1.3; margin: 0; }

/* ---------- header ---------- */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--card); border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.top-inner { max-width: 1180px; margin: 0 auto; display: flex; align-items: center; gap: 16px; padding-block: 10px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); }
.brand-mark { width: 28px; height: 28px; border-radius: 4px; background: var(--wood);
  background-image: linear-gradient(var(--stone-b) 1px, transparent 1px), linear-gradient(90deg, var(--stone-b) 1px, transparent 1px);
  background-size: 9px 9px; background-position: 4px 4px; position: relative; opacity: .95; }
.brand-mark::after { content: ""; position: absolute; width: 9px; height: 9px; border-radius: 50%; background: var(--stone-b); left: 9px; top: 9px; }
.brand-name { font-family: var(--font-display); font-weight: 700; font-size: 19px; letter-spacing: .04em; }
.top-nav { display: flex; gap: 4px; margin-left: auto; flex-wrap: wrap; }
.top-nav a { text-decoration: none; color: var(--muted); padding: 4px 10px; border-radius: 6px; font-size: 14px; }
.top-nav a.on, .top-nav a:hover { color: var(--ink); background: var(--paper); }
.progress-line { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.stones { display: flex; gap: 3px; flex-wrap: wrap; }
.stone { width: 10px; height: 10px; border-radius: 50%; border: 1px solid var(--line); background: transparent; }
.stone.done { background: var(--stone-b); border-color: var(--stone-b); }
:root[data-theme="dark"] .stone.done { background: var(--stone-w); border-color: var(--stone-w); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .stone.done { background: var(--stone-w); border-color: var(--stone-w); } }

/* ---------- shell ---------- */
.shell {
  max-width: 1180px; margin: 0 auto; display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 28px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 24px 64px;
}
.side { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 70px); align-self: start; max-height: calc(100vh - 90px); overflow-y: auto; }
.track { margin-bottom: 18px; }
.track-h { font-size: 12px; letter-spacing: .12em; color: var(--muted); margin: 0 0 6px; display: flex; justify-content: space-between; font-weight: 700; }
.track ul { list-style: none; margin: 0; padding: 0; }
.track a { display: flex; gap: 8px; align-items: baseline; text-decoration: none; color: var(--ink); padding: 5px 8px; border-radius: 6px; font-size: 14px; line-height: 1.45; }
.track a:hover { background: var(--card); }
.track a.on { background: var(--accent-soft); color: var(--ink); font-weight: 500; }
.track a .stone { flex: none; transform: translateY(1px); }
.lvl { flex: none; font-size: 11px; padding: 0 6px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); line-height: 1.6; letter-spacing: .04em; }
.lvl.l2 { border-color: var(--wood); color: var(--wood); }
.lvl.l3 { background: var(--ink); color: var(--paper); border-color: var(--ink); }

main { min-width: 0; }
.crumb { font-size: 13px; color: var(--muted); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
.lesson-h1 { font-size: clamp(24px, 4vw, 34px); margin-bottom: 6px; }
.lead { color: var(--muted); font-size: 16px; margin: 0 0 22px; max-width: 68ch; }
.prose { max-width: 70ch; }
.prose h2 { font-size: 21px; margin: 30px 0 10px; }
.prose h3 { font-size: 17px; margin: 22px 0 6px; }
.prose p, .prose ul, .prose ol { margin: 0 0 12px; }
.prose li { margin-bottom: 4px; }
.prose pre { margin: 6px 0 14px; }
.note { border-left: 3px solid var(--wood); background: var(--wood-soft); padding: 10px 14px; border-radius: 0 8px 8px 0; margin: 14px 0; }
.note.warn { border-color: var(--bad); background: var(--bad-soft); }
.tbl { overflow-x: auto; margin: 10px 0 16px; }
.tbl table { border-collapse: collapse; min-width: 480px; width: 100%; font-size: 14px; }
.tbl th, .tbl td { border-bottom: 1px solid var(--line); padding: 7px 10px; text-align: left; vertical-align: top; }
.tbl th { font-weight: 700; color: var(--muted); font-size: 12px; letter-spacing: .06em; }

/* ---------- blocks ---------- */
.block { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 20px; margin: 26px 0; }
.block-h { display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.block-h h2 { font-size: 18px; }
.tag { font-size: 11px; letter-spacing: .12em; color: var(--wood); font-weight: 700; }
.btn { border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 6px 14px; cursor: pointer; line-height: 1.5; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--card); }
.btn.small { padding: 2px 10px; font-size: 13px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.input, textarea.input, select.input { border: 1px solid var(--line); background: var(--paper); border-radius: 8px; padding: 7px 10px; width: 100%; }
textarea.input { resize: vertical; min-height: 70px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.ok { color: var(--good); } .no { color: var(--bad); }

/* quiz */
.q { margin-bottom: 16px; }
.q-t { font-weight: 500; margin-bottom: 6px; }
.opts { display: grid; gap: 6px; }
.opt { text-align: left; border: 1px solid var(--line); background: var(--paper); border-radius: 8px; padding: 7px 12px; cursor: pointer; line-height: 1.5; }
.opt:hover { border-color: var(--accent); }
.opt.right { border-color: var(--good); background: var(--good-soft); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.explain { font-size: 14px; margin-top: 6px; }

/* videos */
.vids { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.vid { display: flex; gap: 10px; align-items: center; text-decoration: none; color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; background: var(--paper); line-height: 1.45; }
.vid:hover { border-color: var(--accent); }
.play { flex: none; width: 30px; height: 22px; border-radius: 6px; background: var(--bad); position: relative; }
.play::after { content: ""; position: absolute; left: 12px; top: 6px; border-left: 8px solid #fff; border-top: 5px solid transparent; border-bottom: 5px solid transparent; }
.vid small { display: block; color: var(--muted); font-size: 12px; }
.embed { margin-top: 12px; aspect-ratio: 16 / 9; max-width: 100%; width: 100%; border: 0; border-radius: 8px; background: #000; }
.saved-vids { display: grid; gap: 10px; margin-top: 10px; }

.done-bar { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; justify-content: space-between; border-top: 1px solid var(--line); padding-top: 18px; margin-top: 30px; }

/* home */
.hero { padding-block: 8px 10px; }
.hero h1 { font-size: clamp(28px, 5vw, 44px); letter-spacing: .02em; }
.hero p { max-width: 62ch; color: var(--muted); font-size: 16px; }
.ladder { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin: 20px 0; }
.rung { border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; background: var(--card); }
.rung b { font-family: var(--font-display); font-size: 18px; display: block; }
.rung .rank { font-family: var(--font-mono); font-size: 12px; color: var(--wood); }
.track-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.tcard { border: 1px solid var(--line); background: var(--card); border-radius: var(--radius); padding: 16px; text-decoration: none; color: var(--ink); display: flex; flex-direction: column; gap: 6px; }
.tcard:hover { border-color: var(--accent); }
.tcard h3 { font-size: 18px; }
.tcard p { margin: 0; color: var(--muted); font-size: 14px; flex: 1; }
.plan { counter-reset: wk; list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.plan li { display: grid; grid-template-columns: 88px minmax(0, 1fr); gap: 10px; border-bottom: 1px dashed var(--line); padding-bottom: 8px; }
.plan li b { font-family: var(--font-mono); font-size: 13px; color: var(--wood); }

/* glossary */
.gl { display: grid; gap: 10px; margin-top: 14px; }
.gl-item { border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 10px 14px; }
.gl-item b { font-size: 16px; }
.gl-item .en { font-family: var(--font-mono); font-size: 12px; color: var(--muted); margin-left: 6px; }
.gl-item p { margin: 4px 0 0; }

/* widgets */
.term { background: #0d1117; color: #d8dee9; border-radius: 8px; padding: 12px; font-family: var(--font-mono); font-size: 13px; line-height: 1.6; height: 300px; overflow-y: auto; }
.term .p { color: #7ee787; } .term .e { color: #ff7b72; } .term .d { color: #79c0ff; }
.term-in { display: flex; gap: 8px; align-items: center; }
.term-in input { flex: 1; background: transparent; border: 0; color: #d8dee9; outline: none; font-family: var(--font-mono); font-size: 13px; min-width: 0; }
.missions { display: grid; gap: 4px; margin-top: 10px; font-size: 14px; }
.missions .m.done { color: var(--good); text-decoration: line-through; }
.steps { display: grid; gap: 6px; margin-top: 12px; }
.step { border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; background: var(--paper); opacity: .45; transition: opacity .3s, border-color .3s; }
.step.lit { opacity: 1; border-color: var(--accent); }
.step b { font-family: var(--font-mono); font-size: 12px; color: var(--accent); margin-right: 6px; }
.hl { background: var(--wood-soft); border-bottom: 2px solid var(--wood); cursor: pointer; padding: 0 2px; border-radius: 3px; }
.decoded { background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-top: 10px; line-height: 2; word-break: break-word; }
.explain-box { margin-top: 10px; font-size: 14px; min-height: 2em; }
.cols4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-top: 12px; }
.col { border: 1px solid var(--line); border-radius: 8px; padding: 8px; background: var(--paper); min-height: 120px; min-width: 0; }
.col h4 { margin: 0 0 6px; font-size: 13px; }
.col .chip { display: block; font-family: var(--font-mono); font-size: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 2px 6px; margin-bottom: 4px; overflow-wrap: anywhere; }
.log { font-family: var(--font-mono); font-size: 12px; color: var(--muted); margin-top: 8px; min-height: 1.6em; }
.transcript { display: grid; gap: 2px; font-family: var(--font-mono); font-size: 13px; background: var(--code-bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px; overflow-x: auto; }
.tl { padding: 3px 8px; border-radius: 4px; cursor: pointer; white-space: pre-wrap; overflow-wrap: anywhere; }
.tl:hover, .tl.on { background: var(--accent-soft); }
.tl.add { color: var(--good); } .tl.del { color: var(--bad); }
.codepick .tl { white-space: pre; }
.results { display: grid; gap: 8px; }
.result { text-align: left; border: 1px solid var(--line); background: var(--paper); border-radius: 8px; padding: 8px 12px; cursor: pointer; line-height: 1.45; }
.result .u { font-size: 12px; color: var(--good); font-family: var(--font-mono); }
.result .ad { font-size: 11px; font-weight: 700; margin-right: 6px; }
.result.right { border-color: var(--good); } .result.wrong { border-color: var(--bad); }
.keyzone { border: 2px dashed var(--line); border-radius: 8px; padding: 18px; text-align: center; cursor: pointer; }
.keyzone:focus { border-color: var(--accent); outline: none; }
.slider { display: grid; grid-template-columns: 110px minmax(0, 1fr) 64px; gap: 10px; align-items: center; font-size: 14px; }
.slider output { font-family: var(--font-mono); font-variant-numeric: tabular-nums; text-align: right; }
canvas { max-width: 100%; display: block; }
.sim-canvas { width: 100%; height: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); }
.stat { display: flex; gap: 18px; flex-wrap: wrap; font-size: 14px; margin-top: 8px; font-variant-numeric: tabular-nums; }
.stat b { font-family: var(--font-mono); }
.go-wrap { display: grid; grid-template-columns: minmax(0, 420px) minmax(0, 1fr); gap: 18px; align-items: start; }
.go-board { width: 100%; max-width: 420px; aspect-ratio: 1; cursor: pointer; border-radius: 6px; }
.tree { font-family: var(--font-mono); font-size: 13px; }
.tree button { background: none; border: 0; cursor: pointer; padding: 1px 4px; border-radius: 4px; text-align: left; }
.tree button:hover { background: var(--accent-soft); }
.tree ul { list-style: none; margin: 0; padding-left: 18px; border-left: 1px dashed var(--line); }
.pathbar { font-family: var(--font-mono); font-size: 13px; background: var(--code-bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; margin-top: 8px; overflow-wrap: anywhere; }
.proxy-svg { width: 100%; max-width: 640px; height: auto; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
.copy-wrap { position: relative; }
.copy-btn { position: absolute; right: 8px; top: 8px; font-size: 12px; padding: 1px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--card); cursor: pointer; }

/* ---------- phone ---------- */
@media (max-width: 860px) {
  .shell { grid-template-columns: minmax(0, 1fr); gap: 12px; padding-block: 12px 56px; }
  .side { position: static; max-height: none; overflow: visible; }
  .side .track ul { display: none; }
  .side.open .track ul { display: block; }
  .side-toggle { display: inline-flex !important; }
  .go-wrap, .grid2 { grid-template-columns: minmax(0, 1fr); }
  .cols4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .ladder { grid-template-columns: minmax(0, 1fr); }
  .top-nav { margin-left: 0; }
}
.side-toggle { display: none; margin-bottom: 8px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

</style>

<script>
// 课程内容。每课：id / track / level(1基础 2行家 3精通) / title / lead / body(HTML) / widget / quiz / videos
const TRACKS = [
  { id: "pc", name: "电脑基础", desc: "文件、下载安装、快捷键、命令行。把电脑从“会开机”用到“随手解决问题”。" },
  { id: "net", name: "网络与名词", desc: "IP、域名、端口、服务器、“启动服务”“加速”、VPN 和云服务器，一次讲明白。" },
  { id: "video", name: "短视频创作", desc: "定位、拍摄、剪辑、钩子、数据复盘，一条通往 1 万粉的路线。" },
  { id: "ailearn", name: "用 AI 学习", desc: "会提问，会追问，会让 AI 帮你搭物理模型、做实验。" },
  { id: "aicode", name: "AI 编程", desc: "GitHub、本地与云端、读懂 Claude Code、检查代码、本地跑 Kaggle、做围棋 AI。" },
];

const LEVELS = { 1: "基础", 2: "行家", 3: "精通" };

const yt = (t, q) => ({ t, q });

const LESSONS = [
  // ===================== 电脑基础 =====================
  {
    id: "a1", track: "pc", level: 1, title: "文件、文件夹和“路径”",
    lead: "电脑里所有东西都是文件，文件放在文件夹里。路径就是文件的“门牌号”。",
    body: `
<h2>先建立一个画面</h2>
<p>把硬盘想成一栋楼：<b>盘</b>（C 盘、D 盘）是楼，<b>文件夹</b>是房间，<b>文件</b>是房间里的东西。路径就是从大门走到这个东西的路线。</p>
<div class="tbl"><table>
<tr><th>系统</th><th>路径长这样</th><th>分隔符</th></tr>
<tr><td>Windows</td><td><code>C:\\Users\\小明\\Downloads\\setup.exe</code></td><td>反斜杠 <code>\\</code></td></tr>
<tr><td>Mac / Linux</td><td><code>/Users/xiaoming/Downloads/setup.dmg</code></td><td>斜杠 <code>/</code></td></tr>
</table></div>
<h2>三个最常用的文件夹</h2>
<ul>
<li><b>下载 Downloads</b>：浏览器下载的东西默认都在这。找不到下载的文件，先看这里。</li>
<li><b>桌面 Desktop</b>：其实也只是一个文件夹，只是显示在屏幕上。</li>
<li><b>文档 Documents</b>：适合放你自己的作业、项目。</li>
</ul>

<tr><td>代理 (Proxy)</td><td>一般只代理某些程序（比如浏览器）的流量。</td></tr>
<tr><td>“全局模式”/“规则模式”</td><td>全部流量都走中间服务器 / 只有指定网站走。</td></tr>
<tr><td>终端里的代理</td><td>命令行程序（git、pip）默认不走系统代理，要单独设置 <code>HTTPS_PROXY</code> 环境变量。</td></tr>
</table></div>
<div class="note warn"><b>法律提醒</b>：不同国家和地区对 VPN 的规定差别很大。在中国大陆，使用未经批准的跨境 VPN 或“翻墙”服务存在法律风险。请使用学校、公司提供的合规 VPN，或在法律允许的地区使用。本站只讲原理，不提供任何具体服务或节点。</div>

<h2>模型是怎么算出来的</h2>
<p>电脑不会解方程，它只是每次往前走一小步（比如 0.01 秒）：</p>
<ol>
<li>根据当前速度，算出下一刻的位置：<code>x = x + vx·dt</code></li>
<li>根据受力，算出下一刻的速度：<code>vy = vy − g·dt</code>，有空气阻力时速度还要按比例减小</li>
<li>重复，直到落地。</li>
</ol>
<p>这叫<b>数值模拟（欧拉法）</b>。天气预报、游戏物理、火箭轨道，本质都是这个思路。</p>

<ul>
<li>没有空气阻力时，多少度射得最远？</li>

<h2>让 AI 写同样的 Python 代码</h2>

<pre><code>import math
import matplotlib.pyplot as plt

g, k, dt = 9.8, 0.05, 0.01        # 重力加速度、阻力系数、时间步长
for angle in [30, 45, 60]:
    vx = 30 * math.cos(math.radians(angle))
    vy = 30 * math.sin(math.radians(angle))
    x, y, xs, ys = 0, 0, [], []
    while y >= 0:
        xs.append(x); ys.append(y)
        x += vx * dt; y += vy * dt   # 位置更新
        vx -= k * vx * dt            # 阻力让水平速度变小
        vy -= (g + k * vy) * dt      # 重力 + 阻力
    plt.plot(xs, ys, label=f"{angle}°")
plt.legend(); plt.xlabel("距离 m"); plt.ylabel("高度 m"); plt.show()</code></pre>

  {

    body: `
<h2>第一步：测速</h2>
<p>在 KataGo 文件夹打开终端，运行（模型文件名换成你的）：</p>
<pre><code>katago.exe benchmark -model models\\你的模型.bin.gz -config default_gtp.cfg</code></pre>
<ul>
<li>OpenCL 版第一次运行会先<b>自动调优</b>（tuning），可能要好几分钟，屏幕上一直在刷数字是正常的。调优结果会保存，之后不会再调。</li>
<li>结束时会给出一张表，列出不同 <code>numSearchThreads</code>（搜索线程数）下每秒的访问数 visits/s，并推荐一个数值。</li>

<h2>第二步：生成你的配置</h2>
<pre><code>katago.exe genconfig -model models\\你的模型.bin.gz -output my_gtp.cfg</code></pre>
<p>它会一步步问你：用什么规则（中国规则选 chinese）、是否允许认输、每步想多久、显卡用几块、内存多少等。看不懂的问题直接回车，用默认值。最后它会自己跑一次测速，把结果写进 <code>my_gtp.cfg</code>。</p>

<pre><code>katago.exe gtp -model models\\你的模型.bin.gz -config my_gtp.cfg</code></pre>

// ---------- 抛体模拟 ----------
WIDGETS.projectile = (el) => {
  const sl = (id, label, min, max, step, val) => `<div class="slider"><label for="${id}">${label}</label><input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${val}"><output id="${id}-o"></output></div>`;
  el.innerHTML = `<canvas class="sim-canvas" id="pj" width="760" height="320"></canvas><div style="display:grid;gap:4px;margin-top:10px">${sl("pa", "角度 °", 5, 85, 1, 45)}${sl("pv", "初速度 m/s", 5, 50, 1, 30)}${sl("pk", "空气阻力 k", 0, 0.3, 0.01, 0.05)}</div><div class="row" style="margin-top:6px"><label class="small"><input type="radio" name="pg" value="9.8" checked> 地球 g=9.8</label><label class="small"><input type="radio" name="pg" value="1.62"> 月球 g=1.62</label><button class="btn small" id="pbest">找最远角度</button></div><div class="stat" id="pst"></div>`;
  const cv = $("#pj", el), ctx = cv.getContext("2d");
  const sim = (deg, v, k, g) => {
    const dt = 0.005; let x = 0, y = 0, vx = v * Math.cos(deg * Math.PI / 180), vy = v * Math.sin(deg * Math.PI / 180), t = 0, ymax = 0; const pts = [[0, 0]];
    while (y >= 0 && t < 200) { x += vx * dt; y += vy * dt; vx -= k * vx * dt; vy -= (g + k * vy) * dt; t += dt; ymax = Math.max(ymax, y); if (pts.length < 4000) pts.push([x, Math.max(y, 0)]); }
    return { pts, range: x, t, ymax };
  };
  const draw = () => {
    const a = +$("#pa", el).value, v = +$("#pv", el).value, k = +$("#pk", el).value, g = +el.querySelector("input[name=pg]:checked").value;
    $("#pa-o", el).textContent = a; $("#pv-o", el).textContent = v; $("#pk-o", el).textContent = k.toFixed(2);
    const withDrag = sim(a, v, k, g), noDrag = sim(a, v, 0, g);
    const W = cv.width, H = cv.height, pad = 34;
    const maxX = Math.max(noDrag.range, 10) * 1.05, maxY = Math.max(noDrag.ymax, 5) * 1.15;
    const s = Math.min((W - pad * 2) / maxX, (H - pad * 2) / maxY);
    const X = (x) => pad + x * s, Y = (y) => H - pad - y * s;
    ctx.clearRect(0, 0, W, H);
    ctx.strokeStyle = cssVar("--line"); ctx.lineWidth = 1; ctx.fillStyle = cssVar("--muted"); ctx.font = "12px sans-serif";
    const stepM = Math.pow(10, Math.floor(Math.log10(maxX / 5))) * (maxX / 5 / Math.pow(10, Math.floor(Math.log10(maxX / 5))) > 5 ? 5 : maxX / 5 / Math.pow(10, Math.floor(Math.log10(maxX / 5))) > 2 ? 2 : 1);
    for (let m = 0; m <= maxX; m += stepM) { ctx.beginPath(); ctx.moveTo(X(m), Y(0)); ctx.lineTo(X(m), pad / 2); ctx.stroke(); ctx.fillText(Math.round(m) + "m", X(m) - 8, H - 12); }
    ctx.strokeStyle = cssVar("--ink"); ctx.beginPath(); ctx.moveTo(pad, Y(0)); ctx.lineTo(W - 8, Y(0)); ctx.stroke();
    const line = (pts, color, dash) => { ctx.strokeStyle = color; ctx.lineWidth = 2.5; ctx.setLineDash(dash); ctx.beginPath(); pts.forEach(([x, y], i) => (i ? ctx.lineTo(X(x), Y(y)) : ctx.moveTo(X(x), Y(y)))); ctx.stroke(); ctx.setLineDash([]); };
    line(noDrag.pts, cssVar("--muted"), [5, 5]);
    line(withDrag.pts, cssVar("--accent"), []);
    const last = withDrag.pts[withDrag.pts.length - 1]; ctx.fillStyle = cssVar("--wood"); ctx.beginPath(); ctx.arc(X(last[0]), Y(0), 5, 0, 7); ctx.fill();
    const theory = v * v * Math.sin(2 * a * Math.PI / 180) / g;
    $("#pst", el).innerHTML = `<span>有阻力射程 <b>${withDrag.range.toFixed(1)} m</b></span><span>无阻力射程（虚线）<b>${noDrag.range.toFixed(1)} m</b></span><span>课本公式 v²sin2θ/g = <b>${theory.toFixed(1)} m</b></span><span>飞行时间 <b>${withDrag.t.toFixed(2)} s</b></span>`;
  };
  el.querySelectorAll("input").forEach((i) => (i.oninput = draw));
  $("#pbest", el).onclick = () => {
    const v = +$("#pv", el).value, k = +$("#pk", el).value, g = +el.querySelector("input[name=pg]:checked").value;
    let best = 5, br = 0; for (let a = 5; a <= 85; a++) { const r = sim(a, v, k, g).range; if (r > br) { br = r; best = a; } }
    $("#pa", el).value = best; draw();
  };
  draw();
};

  $("#g-reset", el).onclick = () => { st.work = []; st.stage = []; st.local = []; st.remote = []; draw("已清空，重新开始。"); };

// ---------- 9 路围棋 + 规则型 AI ----------
WIDGETS.go = (el) => {
  const N = 9, E = 0, B = 1, W = 2;
  let board, turn, prevKey, caps, passes, over, lastMove;
  el.innerHTML = `<div class="go-wrap"><canvas class="go-board" id="gb" width="540" height="540" aria-label="9 路围棋棋盘"></canvas><div><div class="row"><button class="btn" id="gpass">停一手</button><button class="btn" id="gnew">新对局</button></div><div class="stat" id="gst"></div><p class="small muted" id="gmsg">你执黑先下。点交叉点落子。</p><p class="small muted">AI 思路：能吃子先吃；自己被打吃就长气；不往没气的地方下；不填自己的眼；其余靠近中央、随机一点。双方连续停一手就数子（黑贴 7 目）。</p></div></div>`;
  const cv = $("#gb", el), ctx = cv.getContext("2d");
  const nb = (i) => { const r = Math.floor(i / N), c = i % N, o = []; if (r > 0) o.push(i - N); if (r < N - 1) o.push(i + N); if (c > 0) o.push(i - 1); if (c < N - 1) o.push(i + 1); return o; };
  const group = (b, i) => { const col = b[i], seen = new Set([i]), st = [i], libs = new Set(); while (st.length) { const p = st.pop(); for (const q of nb(p)) { if (b[q] === E) libs.add(q); else if (b[q] === col && !seen.has(q)) { seen.add(q); st.push(q); } } } return { stones: [...seen], libs }; };
  const tryMove = (b, i, col) => {
    if (b[i] !== E) return null;
    const nbk = b.slice(); nbk[i] = col; const opp = 3 - col; let captured = 0;
    for (const q of nb(i)) if (nbk[q] === opp) { const g = group(nbk, q); if (!g.libs.size) { g.stones.forEach((s) => (nbk[s] = E)); captured += g.stones.length; } }
    const me = group(nbk, i); if (!me.libs.size) return null; // 自杀
    const key = nbk.join(""); if (key === prevKey) return null; // 打劫
    return { b: nbk, captured, libs: me.libs.size, size: me.stones.length };
  };
  const reset = () => { board = new Array(N * N).fill(E); turn = B; prevKey = ""; caps = { 1: 0, 2: 0 }; passes = 0; over = false; lastMove = -1; $("#gmsg", el).textContent = "你执黑先下。点交叉点落子。"; draw(); };
  const play = (i, col) => { const r = tryMove(board, i, col); if (!r) return false; prevKey = board.join(""); board = r.b; caps[col] += r.captured; passes = 0; lastMove = i; turn = 3 - col; return true; };
  const isEye = (b, i, col) => nb(i).every((q) => b[q] === col);
  const ai = () => {
    let best = -1, bs = -1e9;
    for (let i = 0; i < N * N; i++) {
      if (board[i] !== E || isEye(board, i, W)) continue;
      const r = tryMove(board, i, W); if (!r) continue;
      let s = r.captured * 12;
      for (const q of nb(i)) if (board[q] === W) { const g = group(board, q); if (g.libs.size === 1) s += 10 * g.stones.length; }
      for (const q of nb(i)) if (r.b[q] === B) { const g = group(r.b, q); if (g.libs.size === 1) s += 4; if (g.libs.size === 2) s += 1; }
      if (r.libs === 1) s -= 15; else s += Math.min(r.libs, 4);
      const rr = Math.floor(i / N), cc = i % N; s -= (Math.abs(rr - 4) + Math.abs(cc - 4)) * 0.35;
      if (rr === 0 || rr === 8 || cc === 0 || cc === 8) s -= 1.5;
      s += Math.random() * 2;
      if (s > bs) { bs = s; best = i; }
    }
    if (best < 0 || (bs < -8 && countEmpty() < 20)) { passes++; turn = B; $("#gmsg", el).textContent = "AI 停一手。" + (passes >= 2 ? "" : "轮到你。"); if (passes >= 2) finish(); }
    else { play(best, W); $("#gmsg", el).textContent = "轮到你。"; }
    draw();
  };
  const countEmpty = () => board.filter((x) => x === E).length;
  const score = () => {
    let s = { 1: 0, 2: 0 }; const seen = new Set();
    for (let i = 0; i < N * N; i++) {
      if (board[i] !== E) { s[board[i]]++; continue; }
      if (seen.has(i)) continue;
      const reg = [i], st = [i], bord = new Set(); seen.add(i);
      while (st.length) { const p = st.pop(); for (const q of nb(p)) { if (board[q] === E && !seen.has(q)) { seen.add(q); st.push(q); reg.push(q); } else if (board[q] !== E) bord.add(board[q]); } }
      if (bord.size === 1) s[[...bord][0]] += reg.length;
    }
    return s;
  };
  const finish = () => { over = true; const s = score(); const w = s[2] + 7; $("#gmsg", el).innerHTML = `终局（简易数子）：黑 ${s[1]}，白 ${s[2]} + 贴 7 = ${w}。<b>${s[1] > w ? "你赢了！" : "白棋（AI）赢了。"}</b>`; draw(); };
  const draw = () => {
    const S = cv.width, m = S / (N + 1);
    ctx.fillStyle = cssVar("--wood"); ctx.fillRect(0, 0, S, S);
    ctx.strokeStyle = "#2a1d0c"; ctx.lineWidth = 1.2;
    for (let k = 0; k < N; k++) { ctx.beginPath(); ctx.moveTo(m, m + k * m); ctx.lineTo(m * N, m + k * m); ctx.stroke(); ctx.beginPath(); ctx.moveTo(m + k * m, m); ctx.lineTo(m + k * m, m * N); ctx.stroke(); }
    ctx.fillStyle = "#2a1d0c"; [[2, 2], [2, 6], [6, 2], [6, 6], [4, 4]].forEach(([r, c]) => { ctx.beginPath(); ctx.arc(m + c * m, m + r * m, 4, 0, 7); ctx.fill(); });
    for (let i = 0; i < N * N; i++) {
      if (!board[i]) continue;
      const x = m + (i % N) * m, y = m + Math.floor(i / N) * m;
      ctx.beginPath(); ctx.arc(x, y, m * 0.46, 0, 7);
      ctx.fillStyle = board[i] === B ? "#16181c" : "#f6f5ef"; ctx.fill();
      ctx.strokeStyle = board[i] === B ? "#000" : "#9a9585"; ctx.lineWidth = 1; ctx.stroke();
      if (i === lastMove) { ctx.beginPath(); ctx.arc(x, y, m * 0.14, 0, 7); ctx.fillStyle = board[i] === B ? "#f6f5ef" : "#16181c"; ctx.fill(); }
    }
    $("#gst", el).innerHTML = `<span>黑提子 <b>${caps[1]}</b></span><span>白提子 <b>${caps[2]}</b></span><span>${over ? "已结束" : turn === B ? "● 黑走" : "○ 白思考中"}</span>`;
  };
  cv.addEventListener("click", (e) => {
    if (over || turn !== B) return;
    const rect = cv.getBoundingClientRect(), m = rect.width / (N + 1);
    const c = Math.round((e.clientX - rect.left) / m) - 1, r = Math.round((e.clientY - rect.top) / m) - 1;
    if (r < 0 || c < 0 || r >= N || c >= N) return;
    if (!play(r * N + c, B)) { $("#gmsg", el).textContent = "这里不能下（有子、自杀或打劫）。"; return; }
    draw(); setTimeout(ai, 250);
  });
  $("#gpass", el).onclick = () => { if (over || turn !== B) return; passes++; turn = W; if (passes >= 2) finish(); else setTimeout(ai, 200); };
  $("#gnew", el).onclick = reset;
  reset();
};

  <div class="rung"><span class="rank">初段 · 1d → 3d</span><b>行家</b><span class="muted small">知道为什么，出问题能自己查。读懂 Claude Code、检查代码、剪辑和写钩子。</span></div>
  <div class="rung"><span class="rank">高段 · 4d+</span><b>精通</b><span class="muted small">能独立做出东西。部署服务器、本地跑 Kaggle、本地部署 KataGo、物理模型、自己的围棋 AI、1 万粉路线。</span></div>
</div>
<h2 style="font-size:22px;margin:28px 0 12px">${TRACKS.length} 条路线</h2>
<div class="track-cards">${TRACKS.map((t) => {
    const ls = LESSONS.filter((l) => l.track === t.id);
    return `<a class="tcard" href="#l-${ls[0].id}"><h3>${t.name}</h3><p>${t.desc}</p><div class="stones">${ls.map((l) => stoneEl(l.id)).join("")}</div></a>`;
  }).join("")}</div>
<div class="block"><div class="block-h"><span class="tag">建议节奏</span><h2>每天 1 小时，8 周</h2></div>
<ol class="plan">
  <li><b>第 1 周</b><span>电脑基础 1–4 课。目标：自己从官网装好 VS Code、Python、剪映。</span></li>
  <li><b>第 2 周</b><span>网络与名词 1–2 课 + 命令行。目标：看到“服务已启动 127.0.0.1:7860”不再慌。</span></li>
  <li><b>第 3 周</b><span>用 AI 学习 1–2 课 + 短视频定位。开始拍“小白学 AI 第 1 天”。</span></li>
  <li><b>第 4 周</b><span>GitHub、本地与云端、读懂 Claude Code。建你的第一个仓库。</span></li>
  <li><b>第 5 周</b><span>检查代码 + 物理模型。用 AI 写出抛体模拟并验证。</span></li>
  <li><b>第 6 周</b><span>本地跑 Kaggle Titanic，提交一次成绩。</span></li>
  <li><b>第 7 周</b><span>实战路线：在自己电脑上部署最新 KataGo 模型，接上 KaTrain 复盘；再用 Python 调用它分析自己的棋谱。</span></li>
  <li><b>第 8 周</b><span>VPN 原理、云服务器部署，把你的作品挂到网上。整理成一个系列视频。</span></li>
</ol></div>`;
}

function renderGlossary() {
  return `<div class="tag">名词速查</div><h1 class="lesson-h1" style="margin-top:6px">看不懂的词，来这里查</h1><p class="lead">${GLOSSARY.length} 个最常遇到的名词。也可以去“端口、服务已启动、加速”那一课，用术语翻译器整句翻译。</p>
<input class="input" id="gq" placeholder="搜索，比如：端口、仓库、加速" aria-label="搜索名词" style="max-width:420px"><div class="gl" id="gl"></div>`;
}
function bindGlossary() {
  const draw = () => {
    const q = $("#gq").value.trim().toLowerCase();
    const list = GLOSSARY.filter((g) => !q || (g.t + g.en + g.d + g.k.join(" ")).toLowerCase().includes(q));
    $("#gl").innerHTML = list.map((g) => `<div class="gl-item"><b>${esc(g.t)}</b><span class="en">${esc(g.en)}</span><p>${esc(g.d)}</p></div>`).join("") || `<p class="muted">没找到。试试问 AI：“用小白能懂的话解释 ${esc(q)}”。</p>`;
  };
  $("#gq").oninput = draw; draw();
}

function renderLesson(l) {
  const t = trackOf(l.track);
  const i = LESSONS.indexOf(l), prev = LESSONS[i - 1], next = LESSONS[i + 1];
  return `
<div class="crumb"><span>${t.name}</span><span>·</span>${lvlTag(l.level)}<span>·</span><span>第 ${i + 1} / ${LESSONS.length} 课</span></div>
<h1 class="lesson-h1">${l.title}</h1>
<p class="lead">${l.lead}</p>
<article class="prose">${l.body}</article>
${l.widget ? `<section class="block"><div class="block-h"><span class="tag">动手练</span><h2>${widgetName(l.widget)}</h2></div><div id="widget"></div></section>` : ""}
${l.extra ? `<article class="prose">${l.extra}</article>` : ""}
<section class="block"><div class="block-h"><span class="tag">视频讲解</span><h2>在 YouTube 上看</h2></div>
  <div class="vids">${l.videos.map((v) => `<a class="vid" href="https://www.youtube.com/results?search_query=${encodeURIComponent(v.q)}" target="_blank" rel="noopener"><span class="play"></span><span>${esc(v.t)}<small>搜索：${esc(v.q)}</small></span></a>`).join("")}</div>
  <p class="small muted" style="margin:12px 0 6px">找到一个讲得好的视频？把 YouTube 链接贴在这里，以后在这一课直接看。</p>
  <div class="row"><input class="input" id="yt-in" placeholder="https://www.youtube.com/watch?v=..." aria-label="YouTube 链接" style="flex:1;min-width:0"><button class="btn" id="yt-add">保存</button></div>
  <div class="saved-vids" id="yt-list"></div>
</section>
<section class="block"><div class="block-h"><span class="tag">小测验</span><h2>检查一下</h2></div><div id="quiz"></div></section>
<div class="done-bar">
  <div class="row">${prev ? `<a class="btn" style="text-decoration:none" href="#l-${prev.id}">← ${prev.title}</a>` : ""}</div>
  <button class="btn ${doneSet.has(l.id) ? "" : "primary"}" id="mark">${doneSet.has(l.id) ? "● 已学完（点击取消）" : "学完了，落一子"}</button>
  <div class="row">${next ? `<a class="btn" style="text-decoration:none" href="#l-${next.id}">${next.title} →</a>` : ""}</div>
</div>`;
}

function widgetName(w) {
  return { pathTree: "点文件夹，看路径怎么变", fakeSearch: "哪个才是官网？", keys: "快捷键练习区", terminal: "模拟终端", dns: "看一次网页访问的全过程", decoder: "术语翻译器", proxy: "直连 vs 代理", niche: "定位生成器", hook: "开头检查器", growth: "1 万粉计算器", prompt: "提示词生成器", projectile: "抛体运动模拟", git: "Git 四个区域", transcript: "点击每一行看解释", bug: "找出 bug", kataWizard: "你的电脑该装哪个版本", annot: "点击每一行看解释", faq: "报错 → 解决方法", go: "和规则型 AI 下一盘 9 路棋" }[w] || "练习";
}

function bindLesson(l) {
  if (l.widget) WIDGETS[l.widget]($("#widget"), l);
  // 测验
  const qz = $("#quiz");
  l.quiz.forEach((q, qi) => {
    const box = h(`<div class="q"><div class="q-t">${qi + 1}. ${esc(q.q)}</div><div class="opts"></div><div class="explain"></div></div>`);
    q.o.forEach((o, oi) => {
      const b = h(`<button class="opt">${esc(o)}</button>`);
      b.onclick = () => {
        box.querySelectorAll(".opt").forEach((x) => x.classList.remove("right", "wrong"));
        b.classList.add(oi === q.a ? "right" : "wrong");
        if (oi !== q.a) box.querySelectorAll(".opt")[q.a].classList.add("right");
        box.querySelector(".explain").innerHTML = `<span class="${oi === q.a ? "ok" : "no"}">${oi === q.a ? "✓ 对了。" : "✗ 不对。"}</span> ${esc(q.e)}`;
      };
      box.querySelector(".opts").appendChild(b);
    });
    qz.appendChild(box);
  });
  // 保存的视频
  const key = "yt-" + l.id;
  const drawVids = () => {
    const list = store.get(key, []);
    $("#yt-list").innerHTML = list.map((u, i) => {
      const id = ytId(u);
      const embed = id && !inFrame ? `<iframe class="embed" src="https://www.youtube-nocookie.com/embed/${id}" title="YouTube 视频" allowfullscreen loading="lazy"></iframe>` : "";
      return `<div>${embed}<div class="row small" style="margin-top:4px"><a href="${esc(u)}" target="_blank" rel="noopener">在 YouTube 打开</a><button class="btn small" data-del="${i}">删除</button></div></div>`;
    }).join("");
    $("#yt-list").querySelectorAll("[data-del]").forEach((b) => (b.onclick = () => { const a = store.get(key, []); a.splice(+b.dataset.del, 1); store.set(key, a); drawVids(); }));
  };
  $("#yt-add").onclick = () => {
    const u = $("#yt-in").value.trim();
    if (!ytId(u)) { $("#yt-in").value = ""; $("#yt-in").placeholder = "这不像 YouTube 视频链接，请粘贴 youtube.com/watch?v=... 或 youtu.be/..."; return; }
    const a = store.get(key, []); a.push(u); store.set(key, a); $("#yt-in").value = ""; drawVids();
  };
  drawVids();
  $("#mark").onclick = () => {
    doneSet.has(l.id) ? doneSet.delete(l.id) : doneSet.add(l.id);
    store.set("done", [...doneSet]);
    const on = doneSet.has(l.id);
    $("#mark").className = "btn" + (on ? "" : " primary");
    $("#mark").textContent = on ? "● 已学完（点击取消）" : "学完了，落一子";
    renderSide(l.id); renderTop("lesson");
  };
}

function route() {
  const hsh = location.hash.slice(1);
  const main = $("#main");
  const m = hsh.match(/^l-(\w+)$/);
  const l = m && LESSONS.find((x) => x.id === m[1]);
  if (l) { main.innerHTML = renderLesson(l); renderSide(l.id); renderTop("lesson"); bindLesson(l); document.title = "棋盘学堂"; }
  else if (hsh === "glossary") { main.innerHTML = renderGlossary(); renderSide(); renderTop("glossary"); bindGlossary(); }
  else { main.innerHTML = renderHome(); renderSide(); renderTop("home"); }
  window.scrollTo(0, 0);
}

window.addEventListener("hashchange", route);
route();

</script>

</html>
